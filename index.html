<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyMix Rapid T600 — 3D-анатомия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121a22; --panel:#18222c; --line:#2a3642; --text:#e9eef2; --muted:#a8b3bd;
    --accent:#f5c400; --accent-rgb:245,196,0; --red:#d33c3c;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 16px 40px;position:relative}

  /* ---------- product switcher ---------- */
  .products{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .products .lab{font:600 12px 'JetBrains Mono';letter-spacing:.16em;color:var(--muted);margin-right:6px}
  .prod{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:6px 16px 6px 8px;text-align:left;transition:all .2s}
  .prod img{width:34px;height:40px;object-fit:contain}
  .prod b{display:block;font-weight:700;font-size:14px;color:#fff}
  .prod span{font-size:12px;color:var(--muted)}
  .prod:hover{border-color:#4a5662}
  .prod.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.08)}
  .tab.on, .cta{transition:background .3s}

  /* ---------- hero banner ---------- */
  .hero{position:relative;overflow:hidden;border-radius:24px;padding:40px 44px 36px;
    background:radial-gradient(circle at 24% 46%,rgba(var(--accent-rgb),.26),transparent 42%),
               radial-gradient(circle at 100% 0%,rgba(255,255,255,.06),transparent 40%),
               linear-gradient(135deg,#0d1216 0%,#161d24 55%,#1d262f 100%);
    border:1px solid #26303a;display:grid;grid-template-columns:minmax(260px,.85fr) 1.15fr;gap:36px;align-items:center}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:44px 44px;mask-image:linear-gradient(90deg,transparent,#000 40%,#000 70%,transparent)}
  .hero::after{content:"";position:absolute;left:-18%;width:70%;bottom:-38%;height:62%;border-radius:50%;
    border-top:6px solid var(--accent);pointer-events:none;opacity:.85}
  .hero-media{position:relative;display:flex;justify-content:center;align-items:center;min-height:460px;z-index:1}
  .hero-media .glow{position:absolute;left:50%;top:50%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(var(--accent-rgb),.55),rgba(var(--accent-rgb),0) 68%);filter:blur(10px)}
  .hero-bag{position:relative;width:auto;height:auto;object-fit:contain;max-width:100%;max-height:520px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55));
    animation:float 6s ease-in-out infinite;transform-origin:50% 100%}
  .hero-media .floor{position:absolute;bottom:-6px;left:18%;right:18%;height:26px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(10px);animation:floor 6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-12px) rotate(.6deg)}}
  @keyframes floor{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.88);opacity:.75}}
  .hero-media.card .hero-bag{border-radius:28px;max-height:450px;filter:none;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
  @media (prefers-reduced-motion:reduce){.hero-bag,.hero-media .floor{animation:none}}
  .hero-body{position:relative;z-index:1}
  .brandline{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:inline-flex;align-items:center;gap:8px;font:800 18px Unbounded;letter-spacing:.02em;color:#fff}
  .logo svg{width:22px;height:22px}
  .tag{display:inline-block;background:rgba(var(--accent-rgb),.14);color:var(--accent);border:1px solid rgba(var(--accent-rgb),.4);font:600 12px 'JetBrains Mono';letter-spacing:.12em;padding:5px 10px;border-radius:4px}
  h1{font:800 clamp(40px,6.4vw,78px)/.98 Unbounded;margin:18px 0 8px;letter-spacing:-.01em}
  h1 span{display:block}
  h1 .y{color:var(--accent)}
  h1.long{font-size:clamp(32px,4.8vw,60px)}
  .sub{font:700 clamp(15px,1.7vw,19px) Inter;text-transform:uppercase;letter-spacing:.04em;color:#fff}
  .sub-kz{font:700 clamp(13px,1.4vw,15px) Inter;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-top:4px}
  .desc{font-size:clamp(15px,1.5vw,17px);line-height:1.6;color:#c2ccd5;max-width:620px;margin:16px 0 22px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid #2c3742;border-bottom:1px solid #2c3742;margin-bottom:22px}
  .kpi{padding:14px 12px;display:flex;flex-direction:column;gap:6px;border-left:1px solid #2c3742}
  .kpi:first-child{border-left:0;padding-left:0}
  .kpi .ic{width:38px;height:38px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent)}
  .kpi .ic svg{width:20px;height:20px}
  .kpi b{font:700 clamp(17px,1.9vw,22px) 'JetBrains Mono';color:#fff;white-space:nowrap}
  .kpi span{font-size:13px;color:var(--muted);line-height:1.3}
  .hero-foot{display:flex;align-items:center;gap:14px 24px;flex-wrap:wrap}
  .price{font:700 clamp(22px,2.6vw,30px) 'JetBrains Mono';color:#fff}
  .price-sub{font:400 13px 'JetBrains Mono';color:var(--muted);margin-top:4px}
  .cta{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:15px;padding:13px 22px;border-radius:999px;background:var(--accent);color:#111;transition:transform .15s,box-shadow .15s}
  .cta:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(var(--accent-rgb),.3)}
  .cta.ghost{background:transparent;color:#fff;border:2px solid #4a5662}
  .cta.ghost:hover{box-shadow:none;border-color:#fff}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  .uses{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
  .uses span{font:500 12px Inter;color:#c9d2da;background:rgba(255,255,255,.05);border:1px solid #2c3742;padding:6px 11px;border-radius:999px}
  .uses span.kz{color:var(--accent);border-color:rgba(var(--accent-rgb),.35)}
  .close{position:absolute;top:18px;right:18px;z-index:2;border:1.5px solid #4a5662;background:rgba(13,18,22,.6);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:#fff}
  .close:hover{border-color:#fff}

  /* ---------- scenario tabs ---------- */
  .sec-title{font:600 14px 'JetBrains Mono';letter-spacing:.2em;color:#c8d0d6;margin:34px 0 12px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tab{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:#c9d2da;transition:all .2s}
  .tab:hover{border-color:#5a6875}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#111}

  /* ---------- viewer ---------- */
  .viewer{position:relative;width:100%;aspect-ratio:16/9;min-height:320px;background:#efefea;overflow:hidden;border-radius:2px}
  .viewer canvas{display:block;width:100%;height:100%}
  .viewer.interactive canvas{cursor:grab}
  .progress{position:absolute;top:0;left:0;height:4px;background:var(--accent);width:0;z-index:3}
  .labels{position:absolute;inset:0;pointer-events:none;z-index:2}
  .lbl{position:absolute;left:0;top:0;transition:opacity .35s}
  .lbl i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .lbl s{position:absolute;left:0;top:0;width:22px;height:1.5px;background:#555;transform-origin:0 0;transform:rotate(-40deg)}
  .lbl span{position:absolute;left:16px;top:-46px;white-space:nowrap;background:#fbfbf8;color:#222;
    border:1.5px solid #8a8a86;border-radius:3px;padding:5px 10px;font:600 clamp(11px,1.3vw,15px) Inter;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .caption{position:absolute;left:2%;right:2%;bottom:3%;z-index:3;display:flex;gap:12px;align-items:center;
    background:rgba(250,250,247,.94);border:1px solid #cfcfca;border-radius:4px;padding:10px 14px;color:#222;font:600 clamp(12px,1.5vw,17px) Inter}
  .caption b{background:#1d242b;color:#fff;font:600 12px 'JetBrains Mono';padding:4px 7px;border-radius:3px;flex:none}
  .badge{position:absolute;top:16px;left:16px;z-index:3;background:#1d242b;color:#fff;font:600 clamp(12px,1.4vw,15px) 'JetBrains Mono';
    padding:8px 12px;border-radius:4px;border-left:4px solid var(--accent);opacity:0;transform:translateY(-6px);transition:all .3s}
  .badge.on{opacity:1;transform:none}
  .hint{position:absolute;top:14px;right:14px;z-index:3;background:rgba(29,36,43,.85);color:#fff;font:500 12px Inter;padding:6px 10px;border-radius:4px;opacity:0;transition:opacity .3s}
  .viewer.interactive .hint{opacity:1}

  .ctrls{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
  .btn{background:transparent;border:2px solid #e9eef2;border-radius:999px;padding:10px 22px;font-weight:700;font-size:16px}
  .btn.on{background:#e9eef2;color:var(--bg)}
  .steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .step{text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:22px;padding:12px 18px;color:#c9d2da;font-size:15px;line-height:1.4;display:flex;gap:10px;transition:border-color .2s,background .2s}
  .step em{font-style:normal;font-family:'JetBrains Mono';color:var(--muted)}
  .step.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.07);color:#fff}

  /* ---------- specs + calculator ---------- */
  .specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .spec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .spec b{display:block;font:600 22px 'JetBrains Mono';color:#fff}
  .spec span{font-size:13px;color:var(--muted)}
  .calc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;grid-template-columns:auto auto 1fr;gap:20px;align-items:end}
  .calc label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
  .calc input{width:140px;background:#0e151c;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font:600 18px 'JetBrains Mono'}
  .calc input:focus{outline:none;border-color:var(--accent)}
  .calc-out{display:flex;gap:22px;flex-wrap:wrap}
  .calc-out div b{display:block;font:600 24px 'JetBrains Mono';color:#fff}
  .calc-out div span{font-size:13px;color:var(--muted)}
  .calc-note{grid-column:1/-1;font-size:13px;color:#ffb08c;min-height:1em;margin:-6px 0 0}
  .foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--muted)}
  .foot a{color:#c9d2da}

  .reopen{display:none;margin:60px auto;max-width:420px;text-align:center}
  .reopen .btn{margin-top:16px}
  body.closed .wrap{display:none}
  body.closed .reopen{display:block}

  @media (max-width:900px){
    .hero{grid-template-columns:.8fr 1.2fr;gap:20px;padding:36px 26px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi:nth-child(3){border-left:0;padding-left:0}
    .kpi:nth-child(n+3){border-top:1px solid #2c3742}
  }
  @media (max-width:760px){
    .hero{grid-template-columns:1fr;padding:56px 18px 26px;gap:8px;border-radius:18px}
    .hero-media{min-height:0}
    .hero-bag{max-height:330px}
    .hero::after{left:-30%;width:160%;bottom:auto;top:300px;height:200px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi:nth-child(3){border-left:0;padding-left:0}
    .kpi:nth-child(n+3){border-top:1px solid #2c3742}
    .hero-actions{margin-left:0;width:100%}
    .cta{flex:1;justify-content:center}
    .close{top:12px;right:12px;padding:6px 12px;font-size:13px}
    .products{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .products .lab{grid-column:1/-1}
    .prod{padding:6px 10px 6px 6px;gap:6px}
    .prod b{font-size:13px}
    .prod span{font-size:11px}
    .viewer{aspect-ratio:4/3}
    .lbl span{top:-38px;padding:3px 7px}
    .calc{grid-template-columns:1fr 1fr}
    .calc input{width:100%}
    .calc-out{grid-column:1/-1}
    .steps{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="products" id="products"><span class="lab">ПРОДУКЦИЯ</span></nav>
  <section class="hero">
    <button class="close" id="closeBtn">Закрыть ✕</button>
    <div class="hero-media">
      <div class="glow"></div>
      <img class="hero-bag" id="bagImg" src="assets/rapid-t600-bag.webp" alt="Мешок EasyMix Rapid T600, 25 кг" width="840" height="900">
      <div class="floor"></div>
    </div>
    <div class="hero-body">
      <div class="brandline">
        <span class="logo" id="logo"></span>
        <span class="tag" id="tag"></span>
      </div>
      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
      <div class="sub-kz" id="subKz"></div>
      <p class="desc" id="desc"></p>
      <div class="kpis" id="kpis"></div>
      <div class="hero-foot">
        <div><div class="price" id="price"></div><div class="price-sub" id="priceSub"></div></div>
        <div class="hero-actions">
          <a class="cta" href="#anatomy">Смотреть 3D-анатомию ↓</a>
          <a class="cta ghost" href="#calc">Рассчитать расход</a>
        </div>
      </div>
      <div class="uses" id="uses"></div>
    </div>
  </section>

  <div class="sec-title" id="anatomy">3D-АНАТОМИЯ: КАК И КУДА НАНОСИТЬ</div>
  <div class="tabs" id="tabs"></div>
  <div class="viewer" id="viewer">
    <div class="progress" id="progress"></div>
    <div class="labels" id="labels"></div>
    <div class="badge" id="badge"></div>
    <div class="hint">Вращайте мышью / пальцем · колесо — масштаб</div>
    <div class="caption"><b id="capNum">1/4</b><span id="capText"></span></div>
  </div>
  <div class="ctrls">
    <button class="btn" id="btn3d">Интерактивный 3D</button>
    <button class="btn" id="btnPlay">Пауза</button>
  </div>
  <div class="steps" id="steps"></div>

  <div class="sec-title" id="specTitle"></div>
  <div class="specs" id="specs"></div>

  <div class="sec-title" id="calc">КАЛЬКУЛЯТОР РАСХОДА</div>
  <div class="calc">
    <label><span id="cLabA">Площадь, м²</span><input id="cArea" type="number" min="0" step="0.1" value="1"></label>
    <label><span id="cLabB">Толщина слоя, мм</span><input id="cThick" type="number" min="0" step="5" value="30"></label>
    <div class="calc-out">
      <div><b id="oKg">—</b><span>сухой смеси</span></div>
      <div><b id="oBags">—</b><span id="oBagsLab">мешков по 25 кг</span></div>
      <div id="oWaterBox"><b id="oWater">—</b><span>воды для затворения</span></div>
      <div id="oGravelBox" hidden><b id="oGravel">—</b><span>щебня 5–6 мм</span></div>
    </div>
    <p class="calc-note" id="cNote"></p>
  </div>

  <div class="foot" id="foot"></div>
</div>

<div class="reopen">
  <h2 style="font:800 28px Unbounded" id="reTitle"></h2>
  <button class="btn" id="openBtn">Открыть 3D-анатомию</button>
</div>

function pourPhase(s) {

    pouring: s > 0.25 && s < 0.84,

}
function makeStream(parent) {

  const p = mesh(new THREE.CircleGeometry(0.17, 24), M.stream, parent, false); p.rotation.x = -PI / 2;

// pieces that fly / fall out: items = [{mesh, v, start}]
function makeDebris(items, dur = 2.5) {

    for (let j = 0; j < N; j++) {
      const th = (j + 0.5 + (odd ? 0.5 : 0)) * step;
      if (th > PI - 0.05) continue;
      const damaged = th > A0 + 0.05 + (r() - .5) * 0.15 && th < A1 - 0.05 + (r() - .5) * 0.15 && y > FY0 + 0.1 && y < FY1 - 0.1 + (r() - .5) * 0.2;
      const mat = damaged ? own(M.old) : M.bricks[Math.floor(r() * 4)];
      if (damaged) mat.color.set(0x7a4a3a).offsetHSL(0, 0, (r() - .5) * 0.1);
      const m = mesh(new THREE.BoxGeometry(RC * step * 0.93, 0.18, RB - RI - 0.01), mat);
      m.position.set(RC * Math.cos(th), y, -RC * Math.sin(th));
      m.rotation.y = th + PI / 2 + (damaged ? (r() - .5) * 0.12 : 0);
      if (damaged) { m.rotation.z = (r() - .5) * 0.15; m.position.multiplyScalar(0.98).setY(y); }
      if (damaged) items.push({ mesh: m, v: V(-Math.cos(th) * (0.8 + r()), 0.3 + r(), Math.sin(th) * (0.8 + r())), start: 0.05 + r() * 0.55 });
    }
  }
  const debris = makeDebris(items, 2.2);

  // formwork
  const form = new THREE.Group(); world.add(form);
  const woodMat = own(M.wood);
  mesh(new THREE.CylinderGeometry(RI - 0.01, RI - 0.01, FY1 - FY0 + 0.1, 32, 1, true, A0 + PI / 2, A1 - A0), woodMat, form).position.y = (FY0 + FY1) / 2;
  for (const th of [A0 + 0.15, (A0 + A1) / 2, A1 - 0.15]) mesh(new THREE.BoxGeometry(0.08, FY1 - FY0 + 0.3, 0.08), woodMat, form).position.set((RI - 0.06) * Math.cos(th), (FY0 + FY1) / 2, -(RI - 0.06) * Math.sin(th));

  const fillMat = own(M.fill);
  const fill = prism(sectorShape(RI + 0.005, RB + 0.004, A0, A1), FY0, FY1, fillMat);
  const bucket = makeBucket(), stream = makeStream();
  const strip = mesh(new THREE.BoxGeometry(0.05, 1.6, 0.1), M.steel);
  const drops = makeDrops(r => { const th = A0 + 0.1 + r() * (A1 - A0 - 0.2), rr = 1.35; return [rr * Math.cos(th), -rr * Math.sin(th)]; }, FY1 + 0.3, FY0, 45);
  const target = V();
  const at = (rr, th, y) => V(rr * Math.cos(th), y, -rr * Math.sin(th));

  return {
    camera: { a: 0.22, r: 11.5, h: 2.4, ty: -2.4, tz: -0.6 },
    labels: [
      { text: 'Кирпичная кладка', pos: at(RI, 2.65, -4.1) },
      { text: 'Грунт', pos: V(3, -3.2, 0) },
      { text: 'Старый бетон', pos: at(RB, PI / 2, -2.3), show: (st, k) => st === 1 || (st === 0 && k > 0.75) },
      { text: 'Опалубка', pos: at(RI - 0.02, A0 + 0.2, FY1 - 0.3), show: (st, k) => st === 2 || st === 3 || (st === 4 && k < 0.3) },
      { text: P.layer + ' · 20–50 мм', pos: at(RI, 1.85, -2.0), show: (st, k) => st === 4 && k > 0.45 },
    ],
    apply({ s, step, t }) {
      debris(s[0]);
      drops(step === 1 && s[1] > 0.05 && s[1] < 0.85, t);
      wetBack(ease(seg(s[1], 0.1, 0.8)));

      const fin = ease(seg(s[2], 0.1, 0.7)), fout = ease(seg(s[4], 0.15, 0.6));
      const fe = step < 2 ? 0 : step < 4 ? fin : 1 - fout;
      form.visible = fe > 0.01; woodMat.opacity = fe;
      const sc = 0.55 + 0.45 * fe; form.scale.set(sc, 1, sc);

      const pp = pourPhase(s[3]), rise = easeOut(seg(s[3], 0.25, 0.86));
      fill.visible = step > 3 || (step === 3 && rise > 0);
      fill.scale.y = step > 3 ? 1 : Math.max(0.002, rise);
      const fy = FY0 + (FY1 - FY0) * fill.scale.y;
      bucket.set(V(-0.05, 0.95 - pp.drop, -1.38), 0, pp.tilt, step === 3 ? pp.op : 0, pp.full);
      target.set(0, fy, -1.38);
      stream(step === 3 && pp.pouring, bucket.lip(), target, t);
      strip.visible = step === 3 && pp.pouring;
      strip.position.set(0.35, fy + 0.6 + Math.sin(t * 7) * 0.25, -1.38);

      fillMat.color.copy(FILL_WET).lerp(FILL_CURED, ease(seg(s[4], 0.2, 0.8)));
      fillMat.roughness = 0.3 + 0.6 * seg(s[4], 0.2, 0.8);
    }
  };
};

  const drops = makeDrops(r => { const [x, z] = HOLES[Math.floor(r() * 4)]; return [x + (r() - .5) * 0.2, z + (r() - .5) * 0.2]; }, 1.8, -0.9, 40);
  const target = V();

  return {
    camera: { a: 0.62, r: 14.5, h: 7.4, ty: 0.6 },
    labels: [
      { text: 'Фундамент', pos: V(-1.6, -1.4, 3) },
      { text: 'Гнездо под анкер', pos: V(1, 0, 1 + HR), show: st => st === 0 },
      { text: 'Анкерный болт', pos: () => V(1, 0.62 + anchors[2].position.y, 1), show: (st, k) => st === 1 && k > 0.35 && k < 0.85 },
      { text: 'Опорная плита', pos: () => V(1.4, 0.47 + plate.position.y - 0.35, -0.5), show: (st, k) => st === 1 ? k > 0.85 : st >= 2 && st < 4 },

      fillMat.roughness = 0.3 + 0.6 * seg(s[4], 0, 0.45);
      const cd = ease(seg(s[4], 0.35, 0.9));
      column.visible = step === 4 && s[4] > 0.3;
      column.position.y = 0.47 + (1 - cd) * 5;
    }
  };
};


/* ---------- RP650: hand-applied repair of reinforced concrete ---------- */
// Element is built in a local frame: repaired face = plane z = 0 facing +z, body towards -z.
function rectXY(x0, x1, y0, y1, Pc = THREE.Shape) {
  const s = new Pc(); s.moveTo(x0, y0); s.lineTo(x1, y0); s.lineTo(x1, y1); s.lineTo(x0, y1); s.closePath(); return s;
}
function extrudeZ(shape, depth) { return new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false }); }

function repairBuilder(o) {
  const grp = new THREE.Group(); world.add(grp); o.place(grp);
  const [px0, px1, py0, py1] = o.pocket, d = o.d, W = o.W;
  const r = rand(o.seed || 31);
  // body: back block + front layer with the damaged pocket
  mesh(extrudeZ(rectXY(-W / 2, W / 2, o.Y0, o.Y1), o.T - d), M.base, grp).position.z = -o.T;
  { const sh = rectXY(-W / 2, W / 2, o.Y0, o.Y1); sh.holes.push(rectXY(px0, px1, py0, py1, THREE.Path));
    mesh(extrudeZ(sh, d), M.base, grp).position.z = -d; }
  const bottomMat = own(M.base), wetBottom = wetter(bottomMat);
  { const g = new THREE.PlaneGeometry(px1 - px0, py1 - py0, 24, 24), pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) pos.setZ(i, (r() - 0.5) * 0.04);
    g.computeVertexNormals(); const m = mesh(g, bottomMat, grp); m.position.set((px0 + px1) / 2, (py0 + py1) / 2, -d + 0.025); }

  // reinforcement
  const rebarMat = own(M.steel), RUST = new THREE.Color(0x8a4a24), STEEL = M.steel.color.clone();
  rebarMat.metalness = 0.35;
  const alongY = o.mainAxis === 'y';
  const bar = (len, rad, x, y, z, vertical) => {
    const m = mesh(new THREE.CylinderGeometry(rad, rad, len, 12), rebarMat, grp);
    m.position.set(x, y, z); if (!vertical) m.rotation.z = PI / 2; return m;
  };
  const mainZ = -d * 0.55, trZ = -d * 0.3;
  const across = alongY ? [px0, px1] : [py0, py1], along = alongY ? [o.Y0, o.Y1] : [-W / 2, W / 2];
  const nMain = 3, mains = [];
  for (let i = 0; i < nMain; i++) {
    const c = across[0] + (across[1] - across[0]) * (0.2 + 0.6 * i / (nMain - 1));
    const len = along[1] - along[0] - 0.1, mid = (along[0] + along[1]) / 2;
    mains.push(alongY ? bar(len, 0.05, c, mid, mainZ, true) : bar(len, 0.05, mid, c, mainZ, false));
  }
  const tr0 = alongY ? py0 : px0, tr1 = alongY ? py1 : px1;
  const ext = alongY ? [-W / 2, W / 2] : [o.Y0, o.Y1];
  for (let v = tr0 + 0.2; v < tr1 - 0.1; v += 0.42) {
    const len = Math.min(across[1] - across[0] + 0.6, ext[1] - ext[0] - 0.12), mid = (ext[0] + ext[1]) / 2;
    alongY ? bar(len, 0.03, mid, v, trZ, false) : bar(len, 0.03, v, mid, trZ, true);
  }

  // damaged concrete chunks
  const items = [];
  const nx = Math.max(2, Math.round((px1 - px0) / 0.26)), ny = Math.max(2, Math.round((py1 - py0) / 0.26));
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    const cx = px0 + (i + 0.5) * (px1 - px0) / nx, cy = py0 + (j + 0.5) * (py1 - py0) / ny;
    const sz = 0.15 + r() * 0.05, g = new THREE.DodecahedronGeometry(sz, 0); g.scale(1, 1, 0.6 + r() * 0.5);
    const m = mesh(g, own(M.old), grp); m.material.color.offsetHSL(0, 0, (r() - 0.5) * 0.12);
    m.position.set(cx + (r() - .5) * 0.05, cy + (r() - .5) * 0.05, -d * 0.45 + r() * 0.06);
    m.rotation.set(r() * 3, r() * 3, r() * 3);
    items.push({ mesh: m, p0: m.position.clone(), r0: m.rotation.clone(), v: V((r() - .5) * 1.2, (r() - .5) * 1.2, 1.2 + r() * 1.5), start: 0.05 + r() * 0.55 });
  }
  const g = o.g;
  const debris = sv => items.forEach(it => {
    const dt = Math.max(0, (sv - it.start) * 2.4), m = it.mesh;
    m.position.copy(it.p0).addScaledVector(it.v, dt).addScaledVector(g, 4.9 * dt * dt);
    m.rotation.set(it.r0.x + dt * 3, it.r0.y + dt * 2, it.r0.z + dt * 4);
    const f = clamp01(1 - dt * 1.4); m.material.opacity = f; m.visible = f > 0.01;
  });

  // tools: wire brush + trowel
  const toolMat = own(M.bucket); toolMat.color.set(P.accent); toolMat.side = THREE.FrontSide;
  const brush = new THREE.Group(); grp.add(brush);
  mesh(new THREE.BoxGeometry(0.34, 0.12, 0.06), toolMat, brush).position.z = 0.09;
  mesh(new THREE.BoxGeometry(0.32, 0.1, 0.06), M.steel, brush).position.z = 0.03;
  mesh(new THREE.BoxGeometry(0.06, 0.06, 0.7), M.wood, brush).position.set(0.12, 0, 0.45);
  const trowel = new THREE.Group(); grp.add(trowel);
  mesh(new THREE.BoxGeometry(0.5, 0.24, 0.015), M.steel, trowel);
  mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.16, 8), M.metal, trowel).rotation.x = PI / 2;
  trowel.children[1].position.z = 0.08;
  const handle = mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.32, 12), toolMat, trowel);
  handle.rotation.z = PI / 2; handle.position.set(0, 0, 0.17);

  // water spray drops travelling towards the face
  const drops = [];
  for (let i = 0; i < 40; i++) {
    const m = mesh(new THREE.SphereGeometry(0.03, 8, 6), M.drop, grp, false);
    m.userData = { x: px0 + 0.1 + r() * (px1 - px0 - 0.2), y: py0 + 0.1 + r() * (py1 - py0 - 0.2), o: r() }; drops.push(m);
  }

  // mortar applied as trowel-loads (cells), bottom row first
  const fillMat = own(M.fill), cells = [];
  const cw = (px1 - px0) / nx, ch = (py1 - py0) / ny;
  const order = [];
  for (let j = 0; j < ny; j++) for (let ii = 0; ii < nx; ii++) order.push([j % 2 ? nx - 1 - ii : ii, j]);
  order.forEach(([i, j], n) => {
    const bulge = 0.015 + r() * 0.03, dep = d + bulge;
    const gg = new THREE.BoxGeometry(cw * 1.005, ch * 1.005, dep); gg.translate(0, 0, dep / 2);
    const m = mesh(gg, fillMat, grp); m.position.set(px0 + (i + 0.5) * cw, py0 + (j + 0.5) * ch, -d);
    m.userData = { n, j, flush: d / dep };
    cells.push(m);
  });
  const N = cells.length;
  const plate = mesh(extrudeZ(rectXY(px0, px1, py0, py1), d), fillMat, grp); plate.position.z = -d;

  const L = (x, y, z) => () => grp.localToWorld(V(x, y, z));
  const barC = alongY ? across[0] + (across[1] - across[0]) * 0.8 : (px0 + px1) / 2 + 0.3;
  return {
    camera: o.camera,
    labels: [
      { text: o.element, pos: L(...o.elementAt, 0) },
      { text: 'Арматура', pos: alongY ? L(barC, py0 + 0.35, mainZ + 0.05) : L(px0 + 0.4, across[0] + (across[1] - across[0]) * 0.8, mainZ + 0.05), show: (st, k) => st === 1 || st === 2 || (st === 0 && k > 0.85) },
      { text: 'Прочное основание', pos: L(px1 - 0.3, py0 + 0.25, -d), show: st => st === 2 },
      { text: P.layer + ' · 15–50 мм', pos: L(px1 - 0.15, (py0 + py1) / 2, 0.03), show: (st, k) => st === 4 || (st === 3 && k > 0.6) },
    ],
    apply({ s, step, t }) {
      debris(s[0]);
      // rust removal
      const clean = ease(seg(s[1], 0.1, 0.85));
      rebarMat.color.copy(RUST).lerp(STEEL, clean); rebarMat.roughness = 0.9 - 0.5 * clean;
      brush.visible = step === 1 && s[1] > 0.05 && s[1] < 0.92;
      { const u = seg(s[1], 0.05, 0.92), k = Math.floor(u * nMain * 0.999), f = (u * nMain) % 1;
        const m = mains[Math.min(nMain - 1, k)], wig = Math.sin(t * 28) * 0.06;
        if (alongY) brush.position.set(m.position.x + wig, py0 + 0.15 + (py1 - py0 - 0.3) * (k % 2 ? 1 - f : f), mainZ + 0.05);
        else brush.position.set(px0 + 0.15 + (px1 - px0 - 0.3) * (k % 2 ? 1 - f : f), m.position.y + wig, mainZ + 0.05);
        brush.rotation.z = alongY ? 0 : PI / 2; }
      // wetting
      const on = step === 2 && s[2] > 0.05 && s[2] < 0.85;
      drops.forEach(m => {
        m.visible = on; if (!on) return;
        const ph = (t * 1.3 + m.userData.o) % 1;
        m.position.set(m.userData.x, m.userData.y, 1.6 - ph * (1.6 + d - 0.04));
      });
      wetBottom(ease(seg(s[2], 0.1, 0.8)));
      // application
      const ap = seg(s[3], 0.08, 0.9) * N;
      const smooth = seg(s[4], 0.05, 0.75);
      cells.forEach(m => {
        const a = clamp01(ap - m.userData.n);
        m.visible = (step > 3 || (step === 3 && a > 0)) && !(step === 4 && smooth >= 1);
        const rowDone = clamp01(smooth * ny - m.userData.j);
        const flush = step < 4 ? 1 : 1 - (1 - m.userData.flush) * ease(rowDone);
        m.scale.set(1, 1, Math.max(0.01, (step > 3 ? 1 : easeOut(a)) * flush));
      });
      plate.visible = step === 4 && smooth >= 1;
      trowel.visible = (step === 3 && s[3] > 0.04 && s[3] < 0.94) || (step === 4 && s[4] < 0.8);
      if (step === 3) {
        const c = cells[Math.min(N - 1, Math.floor(ap))];
        trowel.position.set(c.position.x + Math.sin(t * 9) * 0.05, c.position.y + 0.02, 0.07);
        trowel.rotation.set(0.35, 0, 0);
      } else if (step === 4) {
        const row = Math.min(ny - 1, Math.floor(smooth * ny)), f = (smooth * ny) % 1;
        trowel.position.set(px0 + 0.2 + (px1 - px0 - 0.4) * (row % 2 ? 1 - f : f), py0 + (row + 0.5) * ch, 0.05);
        trowel.rotation.set(0.12, 0, 0);
      }
      fillMat.color.copy(FILL_WET).lerp(FILL_CURED, ease(seg(s[4], 0.4, 1)));
      fillMat.roughness = 0.3 + 0.6 * seg(s[4], 0.4, 1);
    }
  };
}

BUILDERS.column = () => {
  box(-4, 4, -0.4, 0, -4, 4, M.road);
  return repairBuilder({
    W: 1.4, Y0: 0, Y1: 6, T: 1.4, pocket: [-0.5, 0.5, 1.4, 3.7], d: 0.28, mainAxis: 'y',
    place: g => g.position.set(0, 0, 0.7), g: V(0, -1, 0), element: 'Ж/б колонна', elementAt: [0.5, 4.1],
    camera: { a: 0.22, r: 8.5, h: 3.6, ty: 2.6 }
  });
};
BUILDERS.ceiling = () => {

const WATER_MAT = new THREE.MeshStandardMaterial({ color: 0x6fb8ff, roughness: .05, metalness: .1, transparent: true, opacity: .85 });
// instanced water drops: spawn(u, w, origin, velocity) defines each drop's emitter
function makeWater(n, spawn, life = 1.1, g = 4.9) {
  const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(0.024, 8, 6), WATER_MAT, n);
  inst.frustumCulled = false; world.add(inst);
  const r = rand(77), D = [];
  for (let i = 0; i < n; i++) D.push({ o: r(), u: r(), w: r() });
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3(), v = new THREE.Vector3(), o = new THREE.Vector3();
  return (t, intensity, active) => {
    for (let i = 0; i < n; i++) {
      const d = D[i], tau = ((t / life + d.o) % 1) * life;
      const on = intensity > d.w * 0.98 + 0.01 && (!active || active(d.u));
      if (on) {
        spawn(d.u, d.w, o, v);
        p.copy(o).addScaledVector(v, tau); p.y -= g * tau * tau;
        if (p.y < 0.02) p.y = 0.02;
        sc.set(1, 1.6, 1);

      m4.compose(p, q, sc); inst.setMatrixAt(i, m4);

}

function makeGlove() {

      zone.visible = zf > 0.01; zoneMat.opacity = 0.6 * zf; bulbMat.opacity = 0.7 * (1 - zf * 0.8);
      cureFill(zoneMat, zf); cureFill(bulbMat, zf);
    }
  };
};

BUILDERS.masonry = () => {
  box(-4, 4, -0.3, 0, -1.5, 4, M.road);
  box(-2.6, 2.6, 0, 3.0, -0.5, -0.245, M.mortar);
  const r = rand(19), BH = 0.2, J = 0.016, BL = 0.5, voids = [];
  for (let row = 0; row < 14; row++) {
    const y = 0.01 + row * (BH + J) + BH / 2, off = row % 2 ? BL / 2 : 0;
    for (let x0 = -2.6 - off; x0 < 2.6; x0 += BL + J) {
      const a = Math.max(-2.6, x0), b = Math.min(2.6, x0 + BL); if (b - a < 0.08) continue;
      const isVoid = r() < 0.12 && row > 0;
      const mat = isVoid ? own(M.slit) : M.bricks[Math.floor(r() * 4)];
      if (isVoid) mat.color.set(0x262626);
      const m = mesh(new THREE.BoxGeometry(b - a, BH, isVoid ? 0.2 : 0.24), mat);
      m.position.set((a + b) / 2, y, isVoid ? -0.145 : -0.12);
      if (isVoid) voids.push({ m, y });
    }
  }
  const packs = [];
  for (const y of [0.55, 1.4, 2.3]) for (const x of [-1.8, -0.6, 0.6, 1.8]) { const mouth = V(x, y, 0), dir = V(0, 0, -1); packs.push({ mouth, dir, bore: makeBore(mouth, dir, 0.42), pk: makePacker(mouth, dir) }); }
  const drill = makeDrill(), pump = makePump(1.6, 1.5, -0.5);
  const rig = injectionRig(packs, pump);
  const FC = new THREE.Color(0x8e9396), DC = new THREE.Color(0x262626), CC = FILL_CURED.clone();
  return {
    camera: { a: 0.42, r: 7.6, h: 2.2, ty: 1.5 },
    labels: [
      { text: 'Старая кирпичная кладка', pos: V(-2.2, 2.9, 0) },
      { text: 'Пустоты в кладке', pos: () => voids[Math.floor(voids.length / 2)].m.position.clone().setZ(0), show: st => st < 2 },
      ...NC_LABELS(packs, pump, null, 1, 2),
      { text: P.layer + ' заполнил пустоты', pos: () => voids[Math.floor(voids.length / 2)].m.position.clone().setZ(0), show: st => st === 3 },
    ],
    apply({ s, step, t }) {
      drillAndPack(packs, drill, s[0], s[1], step);
      const u = step > 2 ? 1 : step === 2 ? seg(s[2], 0.04, 0.96) : 0, level = u * 3.1;
      const k = step === 2 ? Math.min(packs.length - 1, Math.floor(u * packs.length)) : -1;
      rig(k, t, step === 2 ? k : step > 2 ? 99 : 0);
      const cure = step === 3 ? ease(seg(s[3], 0.1, 0.8)) : 0;
      voids.forEach(v => { const f = v.y < level; v.m.material.color.copy(f ? FC : DC); if (f) v.m.material.color.lerp(CC, cure); v.m.position.z = f ? -0.12 : -0.145; });
    }
  };
};

/* ======================= scenario engine ======================= */
const STEP = 4.5;                 // seconds per step
let cur = null, time = 0, playing = true, interactive = false, lastStep = -1;
const labelsEl = $('labels'), stepsEl = $('steps'), tabsEl = $('tabs');

function clearWorld() {
  world.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material && o.material.userData.own) o.material.dispose();
  });
  world.clear();
}

function load(id) {
  const def = P.scenarios.find(s => s.id === id) || P.scenarios[0];
  clearWorld();
  const inst = BUILDERS[def.id]();
  cur = { def, inst, N: def.steps.length, total: def.steps.length * STEP };
  time = 0; lastStep = -1;

  labelsEl.innerHTML = '';
  inst.labels.forEach(l => {
    const el = document.createElement('div'); el.className = 'lbl';
    el.innerHTML = '<s></s><i></i><span></span>';
    el.querySelector('span').textContent = l.text;
    labelsEl.appendChild(el); l.el = el;
  });
  stepsEl.innerHTML = '';
  def.steps.forEach((s, i) => {
    const b = document.createElement('button'); b.className = 'step';
    b.innerHTML = `<em>${i + 1}.</em><span></span>`;
    b.querySelector('span').textContent = s.text;
    b.onclick = () => { time = i * STEP + 0.01; };
    stepsEl.appendChild(b);
  });
  [...tabsEl.children].forEach(b => b.classList.toggle('on', b.dataset.id === def.id));
  const c = inst.camera;
  controls.target.set(c.tx || 0, c.ty, c.tz || 0);
  if (interactive) { autoCamera(0); controls.update(); }
  try { history.replaceState(null, '', '#' + P.id + '/' + def.id); } catch (e) {}
}

const tmp = new THREE.Vector3();
function updateLabels(step, k) {
  const w = viewer.clientWidth, h = viewer.clientHeight;
  cur.inst.labels.forEach(l => {
    tmp.copy(typeof l.pos === 'function' ? l.pos() : l.pos).project(camera);
    const vis = (!l.show || l.show(step, k)) && tmp.z < 1;
    l.el.style.opacity = vis ? 1 : 0;
    l.el.style.transform = `translate(${(tmp.x * .5 + .5) * w}px, ${(-tmp.y * .5 + .5) * h}px)`;
  });
}

function autoCamera(t) {
  const c = cur.inst.camera;
  const a = c.a + Math.sin(t * 0.12) * 0.25, h = c.h + Math.sin(t * 0.09) * 0.4;
  const tz = c.tz || 0, tx = c.tx || 0;
  camera.position.set(tx + Math.sin(a) * c.r, h, tz + Math.cos(a) * c.r);
  camera.lookAt(tx, c.ty, tz);
}

const btn3d = $('btn3d'), btnPlay = $('btnPlay');
btn3d.onclick = () => {
  interactive = !interactive;
  controls.enabled = interactive;
  viewer.classList.toggle('interactive', interactive);
  btn3d.classList.toggle('on', interactive);
  btn3d.textContent = interactive ? 'Авто-камера' : 'Интерактивный 3D';
  if (interactive) controls.update();
};
btnPlay.onclick = () => { playing = !playing; btnPlay.textContent = playing ? 'Пауза' : 'Играть'; };

function updateUI(step) {
  $('progress').style.width = (time / cur.total * 100) + '%';
  if (step === lastStep) return;
  lastStep = step;
  const s = cur.def.steps[step];
  $('capNum').textContent = `${step + 1}/${cur.N}`;
  $('capText').textContent = s.text;
  $('badge').textContent = s.badge || '';
  $('badge').classList.toggle('on', !!s.badge);
  [...stepsEl.children].forEach((c, i) => c.classList.toggle('active', i === step));
}

function resize() {
  const w = viewer.clientWidth, h = viewer.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 1.5 ? 40 : 32;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewer);
resize();

{
  const [h1, h2] = location.hash.slice(1).split('/');
  const byScen = PRODUCTS.find(p => p.scenarios.some(sc => sc.id === h1));
  if (byScen && !h2) setProduct(byScen.id, h1); else setProduct(h1, h2);
}

const clock = new THREE.Clock();
let camT = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) time = (time + dt) % cur.total;
  camT += dt;
  const step = Math.min(cur.N - 1, Math.floor(time / STEP));
  const k = (time - step * STEP) / STEP;
  const s = cur.def.steps.map((_, i) => step > i ? 1 : step < i ? 0 : k);
  cur.inst.apply({ s, step, k, t: time });
  if (interactive) controls.update(); else autoCamera(camT);
  renderer.render(scene, camera);
  updateLabels(step, k);
  updateUI(step);
  requestAnimationFrame(loop);
}
window.__seek = t => { time = t; };
window.__load = load;
window.__setProduct = setProduct;
loop();
</script>
